<a href="{% url 'plan_detail' plan.pk %}"
   class="card bg-black border-warning mb-2 text-decoration-none text-light drag-item d-block"
   data-id="{{ plan.pk }}" data-type="plan" draggable="true">
    <div class="card-body py-2 px-3">
        <div class="d-flex align-items-center gap-2">
            <div class="drag-handle text-secondary flex-shrink-0"
                 style="cursor:grab; padding:4px 6px; touch-action:none;">
                <i class="bi bi-grip-vertical fs-5"></i>
            </div>
            <div class="flex-grow-1 min-w-0">
                <div class="fw-bold text-truncate">{{ plan.name }}</div>
                <div class="small text-secondary">
                    {{ plan.exercise_count }} esercizi &nbsp;·&nbsp; {{ plan.created_at|date:"d M Y" }}
                </div>
                {% if plan.description %}
                <div class="small text-secondary fst-italic text-truncate">{{ plan.description }}</div>
                {% endif %}
            </div>
            <i class="bi bi-chevron-right text-secondary flex-shrink-0"></i>
        </div>
    </div>
</a>
